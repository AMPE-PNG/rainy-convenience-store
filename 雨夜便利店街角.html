  <script>

      const clamp = (n, a, b) => Math.min(b, Math.max(a, n));

        const n = parseInt(hex.replace("#", ""), 16);
        const r = clamp((n >> 16) + amount, 0, 255);
        const g = clamp(((n >> 8) & 255) + amount, 0, 255);
        const b = clamp((n & 255) + amount, 0, 255);
        return `rgb(${r},${g},${b})`;
      };

      function node(x, y, z) {
        const el = document.createElement("div");
        el.className = "node";
        el.style.transform = `translate3d(${x * U}px, ${-y * U}px, ${z * U}px)`;
        scene.appendChild(el);
        return el;
      }

      function box({
        x = 0, y = 0, z = 0, w = 1, h = 1, d = 1,
        color = "#aeb8bd", top = null, side = null, front = null,
        bottom = null, className = "", radius = 2
      }) {
        const g = node(x, y + h / 2, z);
        const W = w * U, H = h * U, D = d * U;
        const addFace = (width, height, transform, background, cls = "") => {
          const f = document.createElement("div");
          f.className = `face ${className} ${cls}`.trim();
          f.style.width = `${width}px`;
          f.style.height = `${height}px`;
          f.style.left = `${-width / 2}px`;
          f.style.top = `${-height / 2}px`;
          f.style.transform = transform;
          f.style.background = background;
          f.style.borderRadius = `${radius}px`;
          g.appendChild(f);
          return f;
        };
        const topC = top || shade(color, 18);
        const sideC = side || shade(color, -17);
        const frontC = front || color;
        const bottomC = bottom || shade(color, -28);
        addFace(W, D, `translateY(${-H / 2}px) rotateX(90deg)`, topC, "box-top");
        addFace(W, D, `translateY(${H / 2}px) rotateX(-90deg)`, bottomC, "box-bottom");
        addFace(W, H, `translateZ(${D / 2}px)`, frontC, "box-front");
        addFace(W, H, `translateZ(${-D / 2}px) rotateY(180deg)`, shade(color, -13), "box-back");
        addFace(D, H, `translateX(${W / 2}px) rotateY(90deg)`, sideC, "box-right");
        addFace(D, H, `translateX(${-W / 2}px) rotateY(-90deg)`, shade(sideC, 4), "box-left");
        return g;
      }

      function verticalPanel({
        x = 0, y = 0, z = 0, w = 1, h = 1,
        className = "", background = null, rotY = 0, radius = 2
      }) {
        const g = node(x, y + h / 2, z);
        const f = document.createElement("div");
        f.className = `face ${className}`.trim();
        f.style.width = `${w * U}px`;
        f.style.height = `${h * U}px`;
        f.style.left = `${-w * U / 2}px`;
        f.style.top = `${-h * U / 2}px`;
        f.style.transform = `rotateY(${rotY}deg)`;
        if (background) f.style.background = background;
        f.style.borderRadius = `${radius}px`;
        g.appendChild(f);
        return { group: g, face: f };
      }

      function groundPanel({
        x = 0, y = 0.02, z = 0, w = 1, d = 1,
        className = "", background = null, radius = 0
      }) {
        const g = node(x, y, z);
        const f = document.createElement("div");
        f.className = `face ground ${className}`.trim();
        f.style.width = `${w * U}px`;
        f.style.height = `${d * U}px`;
        f.style.left = `${-w * U / 2}px`;
        f.style.top = `${-d * U / 2}px`;
        f.style.transform = "rotateX(90deg)";
        if (background) f.style.background = background;
        f.style.borderRadius = `${radius}px`;
        g.appendChild(f);
        return { group: g, face: f };
      }

      function horizontalFace({
        x = 0, y = 0, z = 0, w = 1, d = 1,
        className = "", background = null, radius = 0
      }) {
        return groundPanel({ x, y, z, w, d, className, background, radius });

        el.innerHTML = html;
        Object.assign(el.style, style);

        return el;

      function rod2d(x1, y1, x2, y2, z, thickness, color, className = "", parent = scene) {
        const dx = (x2 - x1) * U;
        const dy = -(y2 - y1) * U;
        const length = Math.hypot(dx, dy);
        const g = document.createElement("div");
        g.className = "node";
        g.style.transform = `translate3d(${(x1 + x2) * U / 2}px, ${-(y1 + y2) * U / 2}px, ${z * U}px)`;
        const el = document.createElement("div");
        el.className = `face wire ${className}`.trim();
        el.style.width = `${length}px`;
        el.style.height = `${thickness}px`;
        el.style.left = `${-length / 2}px`;
        el.style.top = `${-thickness / 2}px`;
        el.style.transform = `rotateZ(${Math.atan2(dy, dx)}rad)`;
        el.style.background = color;
        g.appendChild(el);
        parent.appendChild(g);
        return g;
      }

        ring.style.top = `${-diameter * U / 2}px`;
        ring.style.borderRadius = "50%";
        ring.style.border = `${Math.max(2, thickness * U)}px solid ${color}`;
        ring.style.background = "transparent";
        ring.style.transform = "translateZ(0.5px)";

      const noEntry = verticalPanel({ x: -2.92, y: 1.62, z: 2.645, w: 0.37, h: 0.37, className: "no-entry", radius: 50 }).face;
      label(noEntry, "", {});

      const railZ = 2.57;
      [-0.32, 0.65, 1.62].forEach((x) => {
        box({ x, y: 0.06, z: railZ, w: 0.08, h: 0.7, d: 0.08, color: "#a8b2b1", top: "#c2cac5", side: "#77878c", radius: 4 });
      });
      box({ x: 0.65, y: 0.58, z: railZ, w: 2.04, h: 0.07, d: 0.08, color: "#aab5b3", className: "rail", radius: 4 });
      box({ x: 0.65, y: 0.36, z: railZ, w: 2.04, h: 0.055, d: 0.07, color: "#b5bfbd", className: "rail", radius: 4 });

      // 小店背侧低墙与街角绿化
      box({ x: -2.55, y: 0.06, z: -2.47, w: 1.1, h: 0.57, d: 0.24, color: "#8f9791", top: "#abb0a7", side: "#66736f", radius: 3 });
      box({ x: 2.76, y: 0.08, z: -2.23, w: 0.58, h: 0.39, d: 0.58, color: "#445355", top: "#596665", side: "#2e3d41", radius: 8 });
      box({ x: 2.76, y: 0.47, z: -2.23, w: 0.17, h: 0.9, d: 0.17, color: "#67594b", top: "#806d5a", side: "#4f443d", radius: 4 });
      const crown = verticalPanel({ x: 2.76, y: 1.28, z: -2.23, w: 1.32, h: 1.12, className: "tree-crown", radius: "48%" }).face;
      crown.style.transform = "rotateY(0deg) rotateZ(-4deg)";
      const crownCross = verticalPanel({ x: 2.76, y: 1.26, z: -2.23, w: 1.08, h: 1.02, className: "tree-crown deep", rotY: 90, radius: "48%" }).face;
      crownCross.style.transform = "rotateY(90deg) rotateZ(5deg)";
      verticalPanel({ x: 2.76, y: 1.69, z: -2.23, w: 0.61, h: 0.58, className: "tree-crown deep", radius: "50%" });

      // 细碎雨滴波纹与薄雾
      [
        [0.9, 1.93, 0.23], [2.4, 2.55, 0.2], [-1.64, 2.9, 0.28], [3.76, 0.16, 0.2]
      ].forEach(([x, z, size], i) => {
        const r = groundPanel({
          x, y: 0.07, z, w: size, d: size * 0.45,
          className: "ripple", radius: 50
        });
        r.face.style.custom = i;
        r.face.style.animationDelay = `${i * .67}s`;
      });
      [
        [-2.5, 2.15, 1.2], [2.7, 2.1, .8], [1.1, 2.55, .95]
      ].forEach(([x, z, w], i) => {
        const fog = groundPanel({ x, y: 0.075, z, w, d: w * .45, className: "steam", radius: 50 });
        fog.face.style.animationDelay = `${i * -2.1}s`;
      });

      // 雨幕
      const rain = document.getElementById("rain");
      for (let i = 0; i < 96; i++) {
        const drop = document.createElement("i");
        drop.className = "raindrop";
        const depth = (i % 5) / 5;
        drop.style.setProperty("--x", `${(i * 37.13) % 103}vw`);
        drop.style.setProperty("--len", `${11 + depth * 23}px`);
        drop.style.setProperty("--speed", `${1.8 + (1 - depth) * 1.25}s`);
        drop.style.setProperty("--delay", `${-((i * 23) % 190) / 100}s`);
        rain.appendChild(drop);
      }

      // 交互式环绕视角：无任何界面控件
      let yaw = -29;
      let pitch = 47;
      let zoom = 0.91;
      let dragging = false;
      let moved = false;
      let lastX = 0;
      let lastY = 0;
      let pinchDistance = 0;
      let idle = 0;

      const applyCamera = () => {
        const responsive = Math.min(1, window.innerWidth / 980, window.innerHeight / 900);
        const finalScale = clamp(responsive, 0.58, 1.24) * zoom;
        rig.style.transform = `rotateX(${-pitch}deg) rotateY(${yaw}deg) scale(${finalScale})`;
      };

      viewport.addEventListener("pointerdown", (e) => {
        if (e.pointerType === "touch" && e.isPrimary === false) return;
        dragging = true;
        moved = false;
        idle = 0;
        lastX = e.clientX;
        lastY = e.clientY;
        viewport.classList.add("dragging");
        viewport.setPointerCapture?.(e.pointerId);
      });

      viewport.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;
        if (Math.abs(dx) + Math.abs(dy) > 1) moved = true;
        yaw += dx * 0.48;
        pitch = clamp(pitch + dy * 0.24, 26, 78);
        lastX = e.clientX;
        lastY = e.clientY;
        idle = 0;
        applyCamera();
      });

      const endDrag = () => {
        dragging = false;
        viewport.classList.remove("dragging");
      };
      viewport.addEventListener("pointerup", endDrag);
      viewport.addEventListener("pointercancel", endDrag);
      viewport.addEventListener("lostpointercapture", endDrag);

      viewport.addEventListener("wheel", (e) => {
        e.preventDefault();
        zoom = clamp(zoom * Math.exp(-e.deltaY * 0.0011), 0.68, 1.68);
        idle = 0;
        applyCamera();
      }, { passive: false });

      viewport.addEventListener("touchstart", (e) => {
        if (e.touches.length === 2) {
          pinchDistance = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
        }
      }, { passive: true });

      viewport.addEventListener("touchmove", (e) => {
        if (e.touches.length !== 2) return;
        e.preventDefault();
        const distance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (pinchDistance > 0) {
          zoom = clamp(zoom * (distance / pinchDistance), 0.68, 1.68);
          pinchDistance = distance;
          idle = 0;
          applyCamera();
        }
      }, { passive: false });

      window.addEventListener("resize", applyCamera);
      applyCamera();

      // 极轻的静置呼吸旋转，让未操作时也像可收藏模型陈列。
      let lastFrame = performance.now();
      const animate = (now) => {
        const dt = Math.min(50, now - lastFrame);
        lastFrame = now;
        if (!dragging) idle += dt;
        if (idle > 4500 && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          yaw += dt * 0.0048;
          applyCamera();
        }
        requestAnimationFrame(animate);
      };
      requestAnimationFrame(animate);
    })();
  </script>
